[weapon]
# Default is Servo/ESC.
#type=SERVO
#min_us=1000 ; minimum microseconds, 1000 is full back
#max_us=2000 ; maximum microseconds, 2000 is full forward
# 1500 is neutral microseconds (for Servos or reversible ESCs)

# For PWM weapons (like lasers or DC motors), use:
#type=PWM; or LASER or DC (min/max us is ignored for PWM)

